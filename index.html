<!doctype html>
<html lang="tr">
  <head>
    <!-- Uygulama kabuğu: telefona/PC'ye kurulabilen küçük bir sayfa.
         Asıl takvim Google Apps Script'te çalışır; bu sayfa onu tam ekran gösterir.
         İnternet yokken en son kaydedilen 2 haftalık programı gösterir ve yeni etkinlik eklemeye izin verir;
         bunlar internet gelince Google Takvim'e işlenir. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Takvim</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --surface: #181b22;
        --border: #2a2f3a;
        --text: #e6e8ee;
        --muted: #8a91a0;
        --accent: #4f8cff;
        --chip-bg: #1e3466;
        --chip-text: #cfe0ff;
        --fixed-bg: #173d2e;
        --fixed-text: #c9f2dc;
        --fixed-border: #3ecf8e;
        --warning: #f5c542;
        --pending-bg: #3a3218;
        --routine-bg: #22252d;
        --routine-text: #b8bfcc;
        --routine-border: #6b7280;
      }

      /* "hidden" verilen öğe her zaman gizlensin (aşağıdaki display kuralları bunu ezmesin) */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }

      #offline-view {
        max-width: 700px;
        margin: 0 auto;
        padding: 12px;
      }

      #offline-banner {
        padding: 8px 12px;
        margin-bottom: 12px;
        border-radius: 6px;
        background: var(--surface);
        color: var(--warning);
        font-size: 14px;
      }

      button {
        padding: 8px 12px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }

      #offline-banner button {
        margin-left: 8px;
        padding: 4px 10px;
        font-size: 14px;
      }

      #offline-form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        padding: 12px;
        border-radius: 6px;
        background: var(--surface);
      }

      #offline-form h2 {
        width: 100%;
        margin: 0;
        font-size: 16px;
      }

      input,
      select {
        font-size: 16px;
        padding: 8px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      #new-title {
        flex: 1;
        min-width: 150px;
      }

      .weekly-label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
      }

      .day {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 6px;
        background: var(--surface);
      }

      .day h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }

      .event {
        margin-bottom: 4px;
        padding: 6px 8px;
        border-left: 3px solid var(--accent);
        border-radius: 3px;
        background: var(--chip-bg);
        color: var(--chip-text);
        font-size: 14px;
      }

      .event.fixed {
        border-left-color: var(--fixed-border);
        background: var(--fixed-bg);
        color: var(--fixed-text);
      }

      .event.routine {
        border-left-color: var(--routine-border);
        background: var(--routine-bg);
        color: var(--routine-text);
      }

      /* Çevrimdışı eklenen, henüz Google'a gitmemiş etkinlik */
      .event.pending {
        border-left-color: var(--warning);
        background: var(--pending-bg);
        color: var(--text);
      }

      .event-note {
        font-size: 12px;
        opacity: 0.7;
      }

      .empty {
        color: var(--muted);
        font-size: 14px;
      }

      /* PC'de bildirim izni henüz verilmediyse sağ altta duran düğme */
      #notify-button {
        position: fixed;
        right: 16px;
        bottom: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <iframe id="calendar-frame" title="Takvim"></iframe>

    <div id="offline-view" hidden>
      <div id="offline-banner"></div>

      <form id="offline-form">
        <h2>Etkinlik ekle (internet gelince takvime işlenir)</h2>
        <input id="new-date" type="date" required />
        <input id="new-title" type="text" placeholder="Etkinlik adı" required />
        <input id="new-time" type="time" title="Başlangıç. Boş bırakırsan tüm gün olur" />
        <input id="new-end-time" type="time" title="Bitiş. Boş bırakırsan 1 saat sürer" />
        <select id="new-reminder" title="Telefona hatırlatma">
          <option value="">Hatırlatma: varsayılan</option>
          <option value="none">Hatırlatma yok</option>
          <option value="0">Tam vaktinde</option>
          <option value="5">5 dk önce</option>
          <option value="10">10 dk önce</option>
          <option value="15">15 dk önce</option>
          <option value="30">30 dk önce</option>
          <option value="60">1 saat önce</option>
          <option value="1440">1 gün önce</option>
        </select>
        <label class="weekly-label"><input id="new-weekly" type="checkbox" /> Her hafta (sabit)</label>
        <button type="submit">Ekle</button>
      </form>

      <div id="offline-days"></div>
    </div>

    <button id="notify-button" hidden>🔔 Bildirimleri aç</button>

    <script>
      const APP_URL =
        "https://script.google.com/macros/s/AKfycby50x0Vt5CeK05aWlG4DMfYQS1n_OKbhoLY_f14WQXkPHhXibJt4gtYxl1vLg_6NMxC/exec";
      const STORAGE_KEY = "takvim-offline-copy"; // Google'dan gelen son 2 haftalık kopya
      const PENDING_KEY = "takvim-pending"; // çevrimdışı eklenip henüz gönderilmemiş etkinlikler
      const OFFLINE_DAYS = 14;
      // Takvim bu süre içinde cevap vermezse bağlantı yok sayılır ve kayıtlı kopya gösterilir
      const WAIT_FOR_CALENDAR_MS = 20000;

      const frame = document.getElementById("calendar-frame");
      const offlineView = document.getElementById("offline-view");
      const banner = document.getElementById("offline-banner");
      const daysBox = document.getElementById("offline-days");
      const offlineForm = document.getElementById("offline-form");

      let waitTimer = null;

      function toDateText(date) {
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return date.getFullYear() + "-" + month + "-" + day;
      }

      function fromDateText(text) {
        const [year, month, day] = text.split("-").map(Number);
        return new Date(year, month - 1, day);
      }

      function addDays(date, count) {
        const result = new Date(date);
        result.setDate(result.getDate() + count);
        return result;
      }

      // localStorage kapalı olabilir (gizli sekme vb.), o yüzden okuma/yazma try içinde
      function readStorage(key, fallback) {
        try {
          return JSON.parse(localStorage.getItem(key)) || fallback;
        } catch (error) {
          return fallback;
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {
          // Depolama kapalıysa yapacak bir şey yok
        }
      }

      // ---- Takvim kopyasındaki etkinlikler ----

      // Bir etkinlik o günde var mı? (Birkaç gün süren tüm gün etkinlikleri her güne düşer)
      function isOnDay(event, dateText) {
        if (event.allDay) return event.start <= dateText && dateText < event.end;
        return event.start === dateText;
      }

      // Bekleyen etkinlik o günde var mı? (Haftalık olanlar aynı gün her hafta tekrarlar)
      function isPendingOnDay(item, dateText) {
        if (item.date === dateText) return true;
        if (!item.weekly || dateText < item.date) return false;
        return fromDateText(item.date).getDay() === fromDateText(dateText).getDay();
      }

      function timeLabel(start, end, allDay) {
        if (allDay) return "Tüm gün";
        return start + "–" + (end || "");
      }

      function renderEvent(event) {
        const box = document.createElement("div");
        box.className = "event";
        if (event.fixed) box.classList.add("fixed");
        if (event.routine) box.classList.add("routine");
        box.textContent = timeLabel(event.time, event.endsLater ? "…" : event.endTime, event.allDay) + "  " + event.title;
        if (event.location) {
          const location = document.createElement("div");
          location.className = "event-note";
          location.textContent = event.location;
          box.appendChild(location);
        }
        return box;
      }

      function renderPendingItem(item) {
        const box = document.createElement("div");
        box.className = "event pending";
        box.textContent = timeLabel(item.time, item.endTime, !item.time) + "  " + item.title;
        const note = document.createElement("div");
        note.className = "event-note";
        note.textContent = "⏳ İnternet gelince takvime eklenecek" + (item.weekly ? " (her hafta)" : "");
        box.appendChild(note);
        return box;
      }

      // ---- Çevrimdışı ekran ----

      function renderBanner(copy, pending) {
        if (!copy) {
          banner.textContent = "İnternet yok ve henüz kaydedilmiş program yok. Bağlanınca 2 hafta otomatik indirilir.";
        } else {
          const savedAt = new Date(copy.savedAt).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" });
          banner.textContent = "Çevrimdışı — son güncelleme: " + savedAt + ".";
        }
        if (pending.length > 0) {
          banner.textContent += " Gönderilmeyi bekleyen: " + pending.length + ".";
        }
        const retry = document.createElement("button");
        retry.textContent = "Tekrar dene";
        retry.addEventListener("click", showCalendar);
        banner.appendChild(retry);
      }

      function renderOfflineView() {
        const copy = readStorage(STORAGE_KEY, null);
        const pending = readStorage(PENDING_KEY, []);
        renderBanner(copy, pending);

        const events = copy ? copy.events.slice().sort((a, b) => a.time.localeCompare(b.time)) : [];
        daysBox.innerHTML = "";
        for (let i = 0; i < OFFLINE_DAYS; i++) {
          const date = addDays(new Date(), i);
          const dateText = toDateText(date);
          const dayBox = document.createElement("div");
          dayBox.className = "day";
          const title = document.createElement("h2");
          title.textContent = date.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
          dayBox.appendChild(title);

          const dayEvents = events.filter((event) => isOnDay(event, dateText));
          const dayPending = pending.filter((item) => isPendingOnDay(item, dateText));
          if (dayEvents.length === 0 && dayPending.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "Etkinlik yok.";
            dayBox.appendChild(empty);
          }
          for (const event of dayEvents) dayBox.appendChild(renderEvent(event));
          for (const item of dayPending) dayBox.appendChild(renderPendingItem(item));
          daysBox.appendChild(dayBox);
        }
      }

      function showOfflineView() {
        clearTimeout(waitTimer);
        frame.hidden = true;
        offlineView.hidden = false;
        renderOfflineView();
      }

      // Çevrimdışı formdan gelen etkinliği bekleyenler listesine ekler.
      // Alanlar Google'daki addEvent'in beklediğiyle aynı; id aynı etkinliğin iki kez eklenmesini önler.
      offlineForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const time = document.getElementById("new-time").value;
        const item = {
          id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
          date: document.getElementById("new-date").value,
          title: document.getElementById("new-title").value.trim(),
          time: time,
          endTime: time ? document.getElementById("new-end-time").value : "",
          reminder: time ? document.getElementById("new-reminder").value : "",
          weekly: document.getElementById("new-weekly").checked,
        };
        const pending = readStorage(PENDING_KEY, []);
        pending.push(item);
        writeStorage(PENDING_KEY, pending);

        document.getElementById("new-title").value = "";
        document.getElementById("new-time").value = "";
        document.getElementById("new-end-time").value = "";
        document.getElementById("new-weekly").checked = false;
        renderOfflineView();
      });

      // ---- Asıl takvim (Google) ----

      // Takvimi yükler; cevap gelmezse kayıtlı kopyaya geçer.
      function showCalendar() {
        if (!navigator.onLine) {
          showOfflineView();
          return;
        }
        offlineView.hidden = true;
        frame.hidden = false;
        frame.src = APP_URL;
        clearTimeout(waitTimer);
        waitTimer = setTimeout(showOfflineView, WAIT_FOR_CALENDAR_MS);
      }

      // Takvimden cevap geldi: internet var, takvimi göster
      function calendarIsUp() {
        clearTimeout(waitTimer);
        offlineView.hidden = true;
        frame.hidden = false;
      }

      // Takvim sayfasıyla (Google'daki iframe) haberleşme
      window.addEventListener("message", (event) => {
        if (!event.origin.endsWith(".googleusercontent.com") || !event.data) return;

        if (event.data.type === "takvim-ready") {
          // Takvim açıldı; bekleyen etkinlik varsa işlesin diye gönder
          calendarIsUp();
          const pending = readStorage(PENDING_KEY, []);
          if (pending.length > 0) {
            event.source.postMessage({ type: "takvim-pending", items: pending }, event.origin);
          }
        }

        if (event.data.type === "takvim-synced") {
          // İşlenenleri bekleyenler listesinden çıkar
          const pending = readStorage(PENDING_KEY, []);
          writeStorage(PENDING_KEY, pending.filter((item) => !event.data.ids.includes(item.id)));
        }

        if (event.data.type === "takvim-offline") {
          // Önümüzdeki 2 haftanın kopyasını sakla
          calendarIsUp();
          writeStorage(STORAGE_KEY, { events: event.data.events, savedAt: event.data.savedAt });
        }
      });

      // ---- PC bildirimleri ----
      // Telefonda/tablette bildirimleri Google Takvim uygulaması gönderir; orada iki kez gelmesin diye bu kısım çalışmaz.
      // PC'de uygulama penceresi açıkken (küçültülmüş olabilir) kayıtlı 2 haftalık kopyadaki etkinlikler için
      // Windows bildirimi gösterir. Her etkinliğin "reminder" alanı kaç dakika önce bildirileceğidir.
      const NOTIFIED_KEY = "takvim-notified"; // bildirimi gösterilmiş etkinlikler (aynısı iki kez gelmesin)
      const CHECK_EVERY_MS = 30000;
      // Bilgisayar uykudan uyanınca bu kadar geç kalmış bildirimler yine gösterilir, daha eskileri atlanır
      const LATE_LIMIT_MS = 5 * 60 * 1000;

      const notifyButton = document.getElementById("notify-button");
      const isPhoneOrTablet = /Android|iPhone|iPad/i.test(navigator.userAgent);

      function eventStart(event) {
        const [hour, minute] = event.time.split(":").map(Number);
        const start = fromDateText(event.start);
        start.setHours(hour, minute);
        return start;
      }

      function showNotification(event) {
        const body = event.time + "–" + (event.endsLater ? "…" : event.endTime) + (event.location ? " · " + event.location : "");
        const notification = new Notification(event.title, { body: body, icon: "icon-192.png", tag: event.start + event.time + event.title });
        notification.addEventListener("click", () => window.focus());
      }

      function checkNotifications() {
        if (Notification.permission !== "granted") return;
        const copy = readStorage(STORAGE_KEY, null);
        if (!copy) return;
        const now = Date.now();
        const notified = readStorage(NOTIFIED_KEY, {});

        for (const event of copy.events) {
          if (event.allDay || event.reminder === null || event.reminder === undefined) continue;
          const key = event.start + " " + event.time + " " + event.title;
          const notifyAt = eventStart(event).getTime() - event.reminder * 60 * 1000;
          if (notified[key] || notifyAt > now || now - notifyAt > LATE_LIMIT_MS) continue;
          showNotification(event);
          notified[key] = notifyAt;
        }

        // Bir günden eski kayıtları temizle
        for (const key in notified) {
          if (now - notified[key] > 24 * 60 * 60 * 1000) delete notified[key];
        }
        writeStorage(NOTIFIED_KEY, notified);
      }

      function updateNotifyButton() {
        notifyButton.hidden = Notification.permission !== "default";
      }

      if (!isPhoneOrTablet && "Notification" in window) {
        notifyButton.addEventListener("click", async () => {
          await Notification.requestPermission();
          updateNotifyButton();
          if (Notification.permission === "granted") {
            new Notification("Takvim", { body: "Bildirimler açık. Etkinlik saatlerinde burada haber vereceğim.", icon: "icon-192.png" });
          }
        });
        updateNotifyButton();
        setInterval(checkNotifications, CHECK_EVERY_MS);
        checkNotifications();
      }

      window.addEventListener("offline", showOfflineView);
      window.addEventListener("online", showCalendar);

      document.getElementById("new-date").value = toDateText(new Date());
      showCalendar();

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
  </body>
</html>
